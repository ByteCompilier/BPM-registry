<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BPM Registry — ByteC Packages</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0d1117; color: #c9d1d9; max-width: 820px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #58a6ff; margin-bottom: 6px; }
    .sub { color: #8b949e; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; font-size: 16px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; color: #fff; margin-bottom: 16px; box-sizing: border-box; }
    input:focus { outline: none; border-color: #58a6ff; }
    .tabs { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
    .tab { background: #161b22; border: 1px solid #30363d; color: #8b949e; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.15s; }
    .tab:hover { border-color: #8b949e; color: #c9d1d9; }
    .tab.active { background: #1f6feb33; border-color: #58a6ff; color: #58a6ff; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 14px; }
    .card-head { display: flex; justify-content: space-between; align-items: center; }
    h3 { margin: 0; color: #f0f6fc; }
    .ver { font-size: 13px; color: #8b949e; font-weight: normal; margin-left: 6px; }
    .badge { font-size: 12px; padding: 3px 8px; border-radius: 12px; background: #21262d; color: #8b949e; }
    .badge.official { background: #1f6feb33; color: #58a6ff; border: 1px solid #1f6feb66; }
    p { color: #8b949e; margin: 10px 0; }
    code { display: block; background: #0d1117; padding: 8px 12px; border-radius: 6px; color: #7ee787; font-size: 14px; }
    .empty { text-align: center; padding: 40px 20px; color: #8b949e; background: #161b22; border: 1px dashed #30363d; border-radius: 8px; display: none; }
  </style>
</head>
<body>
  <h1>BPM Registry</h1>
  <div class="sub">Official Package Registry for ByteC</div>
  <input type="text" id="q" placeholder="Search packages by name, description, or author..." oninput="filter()">
  <div class="tabs">
    <button class="tab active" onclick="setCategory('all', this)">All (2)</button>
    <button class="tab" onclick="setCategory('official', this)">🛡️ Official (2)</button>
    <button class="tab" onclick="setCategory('community', this)">🌍 Community (0)</button>
  </div>
  <div id="list">
        <div class="card" data-category="official" data-search="add  bytecompilier">
          <div class="card-head">
            <h3>add <span class="ver">v1.0.0</span></h3>
            <span class="badge official">Official</span>
          </div>
          <p>No description provided.</p>
          <code>bpm install add</code>
        </div>
        <div class="card" data-category="official" data-search="std  bytecompilier">
          <div class="card-head">
            <h3>std <span class="ver">v1.0.0</span></h3>
            <span class="badge official">Official</span>
          </div>
          <p>No description provided.</p>
          <code>bpm install std</code>
        </div></div>
  <div id="empty" class="empty">No packages found matching your filter.</div>
  <script>
    let currentCat = 'all';

    function setCategory(cat, btn) {
      currentCat = cat;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      filter();
    }

    function filter() {
      const q = document.getElementById('q').value.toLowerCase();
      let visibleCount = 0;

      document.querySelectorAll('.card').forEach(c => {
        const matchText = c.dataset.search.includes(q);
        const matchCat = (currentCat === 'all') || (c.dataset.category === currentCat);
        if (matchText && matchCat) {
          c.style.display = 'block';
          visibleCount++;
        } else {
          c.style.display = 'none';
        }
      });

      document.getElementById('empty').style.display = visibleCount === 0 ? 'block' : 'none';
    }
  </script>
</body>
</html>
