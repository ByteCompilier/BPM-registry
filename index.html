<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BPM Registry</title><style>body{font-family:system-ui,sans-serif;background:#0d1117;color:#c9d1d9;max-width:840px;margin:36px auto;padding:0 20px}.top-bar,.status-bar,.toolbar,.card-head,.cmd-box,.modal-head,.file-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{color:#58a6ff;margin:0}.sub,p,.ver{color:#8b949e;font-size:14px}.nav-btn,.tab,.gear-btn,.copy-btn,.details-btn{background:#161b22;border:1px solid #30363d;color:#c9d1d9;padding:7px 14px;border-radius:8px;text-decoration:none;font-size:13px;cursor:pointer}.nav-btn.primary{background:#238636;border-color:#2ea043;color:#fff}.status-bar{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px 14px;margin:16px 0;font-size:13px}.status-online{color:#3fb950;font-weight:600}input,textarea{width:100%;padding:11px;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#fff;box-sizing:border-box;margin-bottom:14px}.tab.active{background:#1f6feb33;border-color:#58a6ff;color:#58a6ff}.sort-wrap{position:relative}.sort-menu{display:none;position:absolute;right:0;top:40px;background:#161b22;border:1px solid #30363d;border-radius:8px;min-width:170px;z-index:10}.sort-menu.open{display:block}.sort-item{display:block;width:100%;text-align:left;background:none;border:none;color:#c9d1d9;padding:9px 12px;cursor:pointer}.sort-item:hover{background:#21262d}.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;margin-bottom:14px}h3{margin:0;color:#f0f6fc}.meta-right,.tabs,.top-actions{display:flex;gap:8px;align-items:center}.src-link{color:#58a6ff;text-decoration:none;font-size:13px}.badge{font-size:12px;padding:3px 8px;border-radius:12px;background:#21262d}.badge.official{background:#1f6feb33;color:#58a6ff}.cmd-box{background:#0d1117;padding:6px 10px;border-radius:6px;border:1px solid #21262d}code{color:#7ee787}.copy-btn.copied{border-color:#2ea043;color:#7ee787}.empty{text-align:center;padding:30px;border:1px dashed #30363d;border-radius:8px;display:none}.modal-bg{display:none;position:fixed;inset:0;background:rgba(1,4,9,.75);z-index:50;align-items:center;justify-content:center;padding:16px}.modal-bg.open{display:flex}.modal{background:#161b22;border:1px solid #30363d;border-radius:10px;max-width:540px;width:100%;padding:20px;max-height:85vh;overflow-y:auto}.file-list{list-style:none;padding:0}.file-list li{padding:6px 10px;background:#0d1117;border-radius:6px;margin-top:6px;font-family:monospace;font-size:13px}.err{color:#f85149;font-size:13px;margin-bottom:8px}</style></head><body><div class="top-bar"><div><h1>BPM Registry</h1><div class="sub">Official Package Registry for ByteC</div></div><div class="top-actions"><a class="nav-btn" href="https://github.com/ByteCompilier/ByteC" target="_blank">ByteC ↗</a><button class="nav-btn primary" onclick="openPub()">+ Publish Package</button></div></div><div class="status-bar"><div><span class="status-online">● Registry Online & Verified</span> · Patrol Active</div><div>Packages: 1 · Updated: 2026-11-21 05:12 UTC</div></div><input id="q" placeholder="Search name, version, author, description..." oninput="flt()"><div class="toolbar"><div class="tabs"><button class="tab active" onclick="sCat('all',this)">All (1)</button><button class="tab" onclick="sCat('official',this)">🛡️ Official (1)</button><button class="tab" onclick="sCat('community',this)">🌍 Community (0)</button></div><div class="sort-wrap"><button class="gear-btn" onclick="tSort(event)">⚙️</button><div class="sort-menu" id="sm"><button class="sort-item" onclick="sSort('def')">Default</button><button class="sort-item" onclick="sSort('az')">Name: A → Z</button><button class="sort-item" onclick="sSort('za')">Name: Z → A</button></div></div></div><div id="list"><div class="card" data-name="std" data-cat="official" data-s="std1.0.7bytecompiliertest bytec library for bpm!"><div class="card-head"><h3>std <span class=ver>v1.0.7</span></h3><div class="meta-right"><button class=details-btn onclick="openDet('std','1.0.7','ByteCompilier','Test bytec library for BPM!',[])">Details</button> <a class="src-link" href="https://github.com/ByteCompilier/bytec" target="_blank">Source ↗</a> <span class="badge official">Official</span></div></div><p>Test bytec library for BPM!</p><div class="cmd-box"><code>bpm install std</code><button class=copy-btn onclick="cp(this,'bpm install std')">Copy</button></div></div></div><div id="emp" class="empty">No packages found.</div><div class="modal-bg" id="dMod" onclick="if(event.target===this)cMod()"><div class="modal"><div class="modal-head"><h3 id="dT"></h3><button class="nav-btn" onclick="cMod()">✕</button></div><p id="dD"></p><div class="cmd-box"><code id="dC"></code><button class="copy-btn" onclick="cp(this,document.getElementById('dC').textContent)">Copy</button></div><ul class="file-list" id="dF"></ul></div></div><div class="modal-bg" id="pMod" onclick="if(event.target===this)cMod()"><div class="modal"><div class="modal-head"><h3>Publish Package</h3><button class="nav-btn" onclick="cMod()">✕</button></div><input id="pN" placeholder="Package name" oninput="bld()"><input id="pA" placeholder="GitHub username" oninput="bld()"><input id="pV" value="1.0.0" oninput="bld()"><input id="pU" placeholder="Tag ZIP URL (/refs/tags/v1.0.0.zip)" oninput="bld()"><input id="pD" placeholder="Description" oninput="bld()"><div id="pE" class="err"></div><textarea id="pO" rows="4" readonly></textarea><div class="top-actions"><button class="copy-btn" onclick="cp(this,document.getElementById('pO').value)">Copy</button><a id="pL" class="nav-btn primary" href="#" target="_blank">Create on GitHub ↗</a></div></div></div><script>let cat = 'all';
function tSort(e) { e.stopPropagation(); document.getElementById('sm').classList.toggle('open'); }
document.addEventListener('click', function() { document.getElementById('sm').classList.remove('open'); });
function cMod() { document.querySelectorAll('.modal-bg').forEach(function(m) { m.classList.remove('open'); }); }
function sCat(c, b) { cat = c; document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); }); b.classList.add('active'); flt(); }
function sSort(m) { const l = document.getElementById('list'); const cs = Array.from(l.querySelectorAll('.card')); cs.sort(function(a, b) { if (m === 'az') return a.dataset.name.localeCompare(b.dataset.name); if (m === 'za') return b.dataset.name.localeCompare(a.dataset.name); const r = function(x) { return x.dataset.cat === 'official' ? 0 : 1; }; return r(a) - r(b) || a.dataset.name.localeCompare(b.dataset.name); }); cs.forEach(function(c) { l.appendChild(c); }); flt(); }
function flt() { const q = document.getElementById('q').value.toLowerCase().trim(); let v = 0; document.querySelectorAll('.card').forEach(function(c) { const ok = c.dataset.s.includes(q) && (cat === 'all' || c.dataset.cat === cat); c.style.display = ok ? 'block' : 'none'; if (ok) v++; }); document.getElementById('emp').style.display = v ? 'none' : 'block'; }
function cp(b, t) { navigator.clipboard.writeText(t).then(function() { const o = b.textContent; b.textContent = 'Copied!'; b.classList.add('copied'); setTimeout(function() { b.textContent = o; b.classList.remove('copied'); }, 1200); }); }
function openDet(n, v, a, d, files) { document.getElementById('dT').textContent = n + ' v' + v; document.getElementById('dD').textContent = (d || 'No description.') + ' (by ' + a + ')'; document.getElementById('dC').textContent = 'bpm install ' + n; const ul = document.getElementById('dF'); ul.innerHTML = ''; if (!files || !files.length) { const li = document.createElement('li'); li.textContent = 'No files found.'; ul.appendChild(li); } else { files.forEach(function(f) { const x = document.createElement('li'); const sp = document.createElement('span'); const lk = document.createElement('a'); sp.textContent = (f === 'dir' ? '[DIR] ' : '[FILE] ') + f; lk.className = 'src-link'; lk.href = f; lk.target = '_blank'; lk.textContent = 'Open'; x.append(sp, lk); ul.appendChild(x); }); } document.getElementById('dMod').classList.add('open'); }
function openPub() { bld(); document.getElementById('pMod').classList.add('open'); }
function bld() { const n = document.getElementById('pN').value.trim(); const a = document.getElementById('pA').value.trim(); const v = document.getElementById('pV').value.trim(); const u = document.getElementById('pU').value.trim(); const d = document.getElementById('pD').value.trim(); const e = document.getElementById('pE'); e.textContent = (u && (u.includes('/refs/heads/') || (!u.includes('/refs/tags/') && !u.includes('/releases/download/')))) ? 'Use /refs/tags/... or /releases/download/...' : ''; const m = 'url=' + u + String.fromCharCode(10) + 'version=' + v + String.fromCharCode(10) + 'author=' + a + String.fromCharCode(10) + 'description=' + d; document.getElementById('pO').value = m; document.getElementById('pL').href = 'https://github.com/ByteCompilier/BPM-registry/new/main?filename=' + encodeURIComponent(n || 'pkg') + '&value=' + encodeURIComponent(m); }</script></body></html>
