name: Validate Package PR

on:
  pull_request:
    branches: [ main ]

jobs:
  check-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for deleted files
        run: |
          DELETED_FILES=$(git diff --name-only --diff-filter=D origin/main...HEAD)
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"

          if [ -n "$DELETED_FILES" ]; then
            for DEL_FILE in $DELETED_FILES; do
              if [[ "$PR_AUTHOR" != "bytecompilier" && "$PR_AUTHOR" != "gufau9089-tech" ]]; then
                echo "::warning::User '$PR_AUTHOR' is attempting to DELETE file '$DEL_FILE'. Please verify ownership before merging!"
              else
                echo "Owner deleted file: '$DEL_FILE'"
              fi
            done
          fi

      - name: Validate added or modified package files
        run: |
          FILES=$(git diff --name-only --diff-filter=AM origin/main...HEAD)

          if [ -z "$FILES" ]; then
            echo "No package files added or modified."
            exit 0
          fi

          for FILE in $FILES; do
            if [[ "$FILE" == "README.md" || "$FILE" == .github/* || "$FILE" == "LICENSE" ]]; then
              continue
            fi

            echo "=== Checking package: '$FILE' ==="

            # 1. Валидация имени файла (строго как в C-коде BPM)
            if [[ ! "$FILE" =~ ^[a-zA-Z0-9_-]+$ ]]; then
              echo "::error::Invalid package name '$FILE'. Only [a-zA-Z0-9_-] allowed."
              exit 1
            fi

            # 2. Предупреждение при перезаписи существующего пакета
            if git ls-tree -r origin/main --name-only | grep -qx "$FILE"; then
              PR_AUTHOR="${{ github.event.pull_request.user.login }}"
              if [[ "$PR_AUTHOR" != "bytecompilier" && "$PR_AUTHOR" != "gufau9089-tech" ]]; then
                echo "::warning::User '$PR_AUTHOR' is modifying existing package '$FILE'. Please verify ownership before merging!"
              fi
            fi

            # 3. Проверка содержимого файла (ровно 1 строка, без пробелов)
            LINE_COUNT=$(grep -cve '^\s*$' "$FILE")
            if [ "$LINE_COUNT" -ne 1 ]; then
              echo "::error::File '$FILE' must contain exactly one non-empty line with the URL (found $LINE_COUNT)."
              exit 1
            fi

            URL=$(head -n 1 "$FILE" | tr -d '\r')
            if [[ "$URL" =~ [[:space:]] ]]; then
              echo "::error::URL in '$FILE' contains spaces. Please trim trailing spaces."
              exit 1
            fi

            if [[ ! "$URL" =~ ^https:// ]]; then
              echo "::error::URL must start with https:// (HTTP is insecure). Found: '$URL'"
              exit 1
            fi

            # 4. Скачивание с лимитом 50 МБ и проверка HTTP 200
            rm -rf /tmp/test_pkg.zip /tmp/unpacked
            HTTP_CODE=$(curl -sL --max-filesize 52428800 -o /tmp/test_pkg.zip -w "%{http_code}" "$URL")
            if [ "$HTTP_CODE" -ne 200 ]; then
              echo "::error::Failed to download archive (HTTP $HTTP_CODE or file > 50MB): $URL"
              exit 1
            fi

            # 5. Проверка ZIP-сигнатуры и реальной распаковки как в BPM (--strip-components=1)
            if ! file /tmp/test_pkg.zip | grep -qi "Zip archive"; then
              echo "::error::Downloaded file is not a valid ZIP archive."
              exit 1
            fi

            mkdir -p /tmp/unpacked
            if ! tar -xf /tmp/test_pkg.zip --strip-components=1 -C /tmp/unpacked; then
              echo "::error::tar failed to extract archive with --strip-components=1."
              exit 1
            fi

            if [ -z "$(ls -A /tmp/unpacked)" ]; then
              echo "::error::Archive extracted empty directory! Make sure files are inside a top-level folder."
              exit 1
            fi

            # 6. Проверка на запрещённые исполняемые файлы внутри пакета
            DANGEROUS=$(find /tmp/unpacked -type f \( -iname "*.exe" -o -iname "*.dll" -o -iname "*.bat" -o -iname "*.ps1" -o -iname "*.vbs" \))
            if [ -n "$DANGEROUS" ]; then
              echo "::error::Executable binaries/scripts are not allowed in packages: $DANGEROUS"
              exit 1
            fi

            rm -rf /tmp/test_pkg.zip /tmp/unpacked
            echo "SUCCESS: '$FILE' is valid, safe, and ready for BPM!"
          done
