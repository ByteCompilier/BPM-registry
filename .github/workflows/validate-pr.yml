name: Validate Package PR

on:
  pull_request:
    branches: [ main ]

jobs:
  check-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for deleted files
        run: |
          DELETED_FILES=$(git diff --name-only --diff-filter=D origin/main...HEAD)
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"

          if [ -n "$DELETED_FILES" ]; then
            for DEL_FILE in $DELETED_FILES; do
              if [[ "$PR_AUTHOR" != "bytecompilier" && "$PR_AUTHOR" != "gufau9089-tech" ]]; then
                echo "::error::User '$PR_AUTHOR' is NOT allowed to DELETE file '$DEL_FILE'!"
                exit 1
              else
                echo "Owner deleted file: '$DEL_FILE'"
              fi
            done
          fi

      - name: Validate added or modified package files
        run: |
          FILES=$(git diff --name-only --diff-filter=AM origin/main...HEAD)
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"

          if [ -z "$FILES" ]; then
            echo "No package files added or modified."
            exit 0
          fi

          for FILE in $FILES; do
            # Игнорируем служебные файлы репозитория и веб-страницу
            if [[ "$FILE" == "README.md" || "$FILE" == "index.html" || "$FILE" == .github/* || "$FILE" == "LICENSE" ]]; then
              continue
            fi

            echo "=== Checking package: '$FILE' ==="

            # 1. Валидация имени файла (только буквы, цифры, '-' и '_')
            if [[ ! "$FILE" =~ ^[a-zA-Z0-9_-]+$ ]]; then
              echo "::error::Invalid package name '$FILE'. Only [a-zA-Z0-9_-] allowed."
              exit 1
            fi

            # 2. Жесткий запрет на перезапись существующего пакета посторонними пользователями
            if git ls-tree -r origin/main --name-only | grep -qx "$FILE"; then
              if [[ "$PR_AUTHOR" != "bytecompilier" && "$PR_AUTHOR" != "gufau9089-tech" ]]; then
                echo "::error::User '$PR_AUTHOR' is NOT allowed to modify existing package '$FILE'!"
                exit 1
              fi
            fi

            # 3. Проверка обязательных полей метафайла (url, version, author, description)
            for KEY in url version author description; do
              if ! grep -q "^${KEY}=" "$FILE"; then
                echo "::error::Missing required field '${KEY}=' in '$FILE'."
                exit 1
              fi
            done

            URL=$(grep '^url=' "$FILE" | head -n 1 | cut -d'=' -f2- | tr -d '\r')
            VERSION=$(grep '^version=' "$FILE" | head -n 1 | cut -d'=' -f2- | tr -d '\r')
            AUTHOR=$(grep '^author=' "$FILE" | head -n 1 | cut -d'=' -f2- | tr -d '\r')
            DESC=$(grep '^description=' "$FILE" | head -n 1 | cut -d'=' -f2- | tr -d '\r')

            if [ -z "$URL" ] || [ -z "$VERSION" ] || [ -z "$AUTHOR" ] || [ -z "$DESC" ]; then
              echo "::error::Fields url, version, author, and description cannot be empty in '$FILE'."
              exit 1
            fi

            if [[ "$URL" =~ [[:space:]] ]]; then
              echo "::error::URL in '$FILE' contains spaces. Please trim trailing spaces."
              exit 1
            fi

            if [[ ! "$URL" =~ ^https://github\.com/ ]]; then
              echo "::error::URL must start with https://github.com (Found: '$URL')"
              exit 1
            fi

            # 4. Запрет изменяемых веток (/refs/heads/) — только теги или релизы
            if [[ "$URL" == *"/refs/heads/"* ]] || [[ "$URL" != *"/refs/tags/"* && "$URL" != *"/releases/download/"* ]]; then
              echo "::error::Mutable branch URLs are forbidden! Use an immutable GitHub Tag (/refs/tags/...) or Release (/releases/download/...) URL."
              exit 1
            fi

            # 5. Проверка авторства и принадлежности репозитория
            if [[ "$PR_AUTHOR" != "bytecompilier" && "$PR_AUTHOR" != "gufau9089-tech" ]]; then
              if [[ "${AUTHOR,,}" != "${PR_AUTHOR,,}" ]]; then
                echo "::error::Field 'author=$AUTHOR' must match your GitHub username '$PR_AUTHOR'!"
                exit 1
              fi
            fi

            if [[ "${URL,,}" != "https://github.com${AUTHOR,,}/"* ]]; then
              echo "::error::Repository URL '$URL' must belong to author '$AUTHOR' (https://github.com$AUTHOR/...)."
              exit 1
            fi

            # 6. Скачивание архива с лимитом 50 МБ и проверка HTTP 200
            rm -rf /tmp/test_pkg.zip /tmp/raw_zip /tmp/unpacked
            HTTP_CODE=$(curl -sL --max-filesize 52428800 -o /tmp/test_pkg.zip -w "%{http_code}" "$URL")
            if [ "$HTTP_CODE" -ne 200 ]; then
              echo "::error::Failed to download archive (HTTP $HTTP_CODE or file > 50MB): $URL"
              exit 1
            fi

            # 7. Проверка ZIP-сигнатуры и структуры архива (имитация --strip-components=1 на Windows)
            if ! file /tmp/test_pkg.zip | grep -qi "Zip archive"; then
              echo "::error::Downloaded file is not a valid ZIP archive."
              exit 1
            fi

            mkdir -p /tmp/raw_zip /tmp/unpacked
            if ! unzip -q /tmp/test_pkg.zip -d /tmp/raw_zip; then
              echo "::error::unzip failed to extract archive."
              exit 1
            fi

            TOP_DIRS=$(find /tmp/raw_zip -mindepth 1 -maxdepth 1 -type d)
            if [ -z "$TOP_DIRS" ]; then
              echo "::error::Archive must contain a top-level folder (standard GitHub ZIP structure) so --strip-components=1 works on Windows."
              exit 1
            fi

            cp -r /tmp/raw_zip/*/* /tmp/unpacked/ 2>/dev/null || true

            if [ -z "$(ls -A /tmp/unpacked)" ]; then
              echo "::error::Archive extracted empty directory! Make sure your library files are inside the repository folder."
              exit 1
            fi

            # 8. Строгий белый список расширений внутри архива
            BAD_FILES=$(find /tmp/unpacked -type f ! \( -iname "*.bytec" -o -iname "*.md" -o -iname "*.txt" -o -iname "LICENSE*" \))
            if [ -n "$BAD_FILES" ]; then
              echo "::error::Forbidden file types found! Only .bytec, .md, .txt, and LICENSE files are allowed. Found: $BAD_FILES"
              exit 1
            fi

            rm -rf /tmp/test_pkg.zip /tmp/raw_zip /tmp/unpacked
            echo "SUCCESS: '$FILE' (v$VERSION by $AUTHOR) passed all security checks!"
          done
