name: Update Package Catalog

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_TOKEN }}

      - name: Generate README and Web Catalog
        run: |
          python3 - << 'EOF'
          import os, html

          NL = chr(10)
          ignore = {'README.md', 'LICENSE', '.gitignore', 'index.html'}
          official_authors = {'bytecompilier', 'gufau9089-tech'}

          official_rows = []
          community_rows = []
          official_cards = []
          community_cards = []

          for name in sorted(os.listdir('.')):
              if name.startswith('.') or name in ignore or not os.path.isfile(name):
                  continue

              data = {}
              with open(name, 'r', encoding='utf-8', errors='ignore') as f:
                  for line in f:
                      if '=' in line:
                          k, v = line.strip().split('=', 1)
                          data[k.strip()] = v.strip()

              if 'version' in data and 'author' in data:
                  ver = data.get('version', '-')
                  author = data.get('author', '-')
                  desc = data.get('description', '')
                  url = data.get('url', '')
                  safe_desc = desc.replace('|', '\\|')
                  is_official = author.lower() in official_authors

                  repo_url = url
                  for marker in ('/archive/', '/releases/'):
                      if marker in url:
                          repo_url = url.split(marker)[0]
                          break

                  source_link = f'<a class="src-link" href="{html.escape(repo_url)}" target="_blank" rel="noopener">Source ↗</a>' if repo_url.startswith('https://') else ''

                  if is_official:
                      official_rows.append(f"| `{name}` | `{ver}` | 🛡️ Official | {safe_desc} |")
                      badge = '<span class="badge official">Official</span>'
                      cat = 'official'
                  else:
                      community_rows.append(f"| `{name}` | `{ver}` | [@{author}](https://github.com{author}) | {safe_desc} |")
                      badge = f'<span class="badge">@{html.escape(author)}</span>'
                      cat = 'community'

                  search_blob = f"{name} {ver} v{ver} {author} {desc}".lower()

                  card_html = f'''
                  <div class="card" data-name="{html.escape(name.lower())}" data-category="{cat}" data-search="{html.escape(search_blob)}">
                    <div class="card-head">
                      <h3>{html.escape(name)} <span class="ver">v{html.escape(ver)}</span></h3>
                      <div class="meta-right">
                        {source_link}
                        {badge}
                      </div>
                    </div>
                    <p>{html.escape(desc) or "No description provided."}</p>
                    <div class="cmd-box">
                      <code>bpm install {html.escape(name)}</code>
                      <button class="copy-btn" onclick="copyCmd(this, 'bpm install {html.escape(name)}')">Copy</button>
                    </div>
                  </div>'''

                  if is_official:
                      official_cards.append(card_html)
                  else:
                      community_cards.append(card_html)

          web_cards = official_cards + community_cards

          def build_table(rows, empty_msg):
              if not rows:
                  return empty_msg
              lines = [
                  "| Package | Version | Author | Description |",
                  "| :--- | :--- | :--- | :--- |"
              ]
              lines.extend(rows)
              return NL.join(lines)

          official_table = build_table(official_rows, "_No official packages yet._")
          community_table = build_table(community_rows, "_No community packages published yet. Be the first to open a PR!_")

          with open('README.md', 'r', encoding='utf-8') as f:
              readme = f.read()

          def replace_block(text, start_tag, end_tag, content):
              if start_tag in text and end_tag in text:
                  before = text.split(start_tag)[0]
                  after = text.split(end_tag)[1]
                  return before + start_tag + NL + content + NL + end_tag + after
              return text

          new_readme = replace_block(readme, "<!-- OFFICIAL_START -->", "<!-- OFFICIAL_END -->", official_table)
          new_readme = replace_block(new_readme, "<!-- COMMUNITY_START -->", "<!-- COMMUNITY_END -->", community_table)

          if new_readme != readme:
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(new_readme)
          html_page = f'''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>BPM Registry — ByteC Packages</title>
            <style>
              body {{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0d1117; color: #c9d1d9; max-width: 820px; margin: 40px auto; padding: 0 20px; }}
              h1 {{ color: #58a6ff; margin-bottom: 6px; }}
              .sub {{ color: #8b949e; margin-bottom: 20px; }}
              input {{ width: 100%; padding: 12px; font-size: 16px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; color: #fff; margin-bottom: 16px; box-sizing: border-box; }}
              input:focus {{ outline: none; border-color: #58a6ff; }}
              .toolbar {{ display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }}
              .tabs {{ display: flex; gap: 10px; flex-wrap: wrap; }}
              .tab, .gear-btn {{ background: #161b22; border: 1px solid #30363d; color: #8b949e; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.15s; }}
              .tab:hover, .gear-btn:hover {{ border-color: #8b949e; color: #c9d1d9; }}
              .tab.active {{ background: #1f6feb33; border-color: #58a6ff; color: #58a6ff; }}
              .sort-wrap {{ position: relative; }}
              .gear-btn {{ padding: 8px 12px; font-size: 15px; }}
              .sort-menu {{ display: none; position: absolute; right: 0; top: 42px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; min-width: 190px; box-shadow: 0 8px 24px rgba(0,0,0,0.45); z-index: 10; overflow: hidden; }}
              .sort-menu.open {{ display: block; }}
              .sort-item {{ display: block; width: 100%; text-align: left; background: none; border: none; color: #c9d1d9; padding: 10px 14px; font-size: 14px; cursor: pointer; }}
              .sort-item:hover {{ background: #21262d; }}
              .sort-item.active {{ color: #58a6ff; font-weight: 600; }}
              .card {{ background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 14px; }}
              .card-head {{ display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }}
              .meta-right {{ display: flex; align-items: center; gap: 10px; }}
              h3 {{ margin: 0; color: #f0f6fc; }}
              .ver {{ font-size: 13px; color: #8b949e; font-weight: normal; margin-left: 6px; }}
              .src-link {{ font-size: 13px; color: #58a6ff; text-decoration: none; }}
              .src-link:hover {{ text-decoration: underline; }}
              .badge {{ font-size: 12px; padding: 3px 8px; border-radius: 12px; background: #21262d; color: #8b949e; }}
              .badge.official {{ background: #1f6feb33; color: #58a6ff; border: 1px solid #1f6feb66; }}
              p {{ color: #8b949e; margin: 10px 0; }}
              .cmd-box {{ display: flex; justify-content: space-between; align-items: center; background: #0d1117; padding: 6px 8px 6px 12px; border-radius: 6px; border: 1px solid #21262d; }}
              code {{ color: #7ee787; font-size: 14px; overflow-x: auto; }}
              .copy-btn {{ background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; transition: 0.15s; flex-shrink: 0; }}
              .copy-btn:hover {{ background: #30363d; color: #fff; }}
              .copy-btn.copied {{ background: #23863633; border-color: #2ea043; color: #7ee787; }}
              .empty {{ text-align: center; padding: 40px 20px; color: #8b949e; background: #161b22; border: 1px dashed #30363d; border-radius: 8px; display: none; }}
            </style>
          </head>
          <body>
            <h1>BPM Registry</h1>
            <div class="sub">Official Package Registry for ByteC</div>
            <input type="text" id="q" placeholder="Search by name, version (e.g. 1.0.0), author, or description..." oninput="filter()">
            <div class="toolbar">
              <div class="tabs">
                <button class="tab active" onclick="setCategory('all', this)">All ({len(web_cards)})</button>
                <button class="tab" onclick="setCategory('official', this)">🛡️ Official ({len(official_cards)})</button>
                <button class="tab" onclick="setCategory('community', this)">🌍 Community ({len(community_cards)})</button>
              </div>
              <div class="sort-wrap">
                <button class="gear-btn" title="Sort packages" onclick="toggleSortMenu(event)">⚙️</button>
                <div class="sort-menu" id="sortMenu">
                  <button class="sort-item active" onclick="setSort('default', this)">Default (Official first)</button>
                  <button class="sort-item" onclick="setSort('az', this)">Name: A → Z</button>
                  <button class="sort-item" onclick="setSort('za', this)">Name: Z → A</button>
                </div>
              </div>
            </div>
            <div id="list">{"".join(web_cards)}</div>
            <div id="empty" class="empty">No packages found matching your query.</div>
            <script>
              let currentCat = 'all';
              let currentSort = 'default';

              function toggleSortMenu(e) {{
                e.stopPropagation();
                document.getElementById('sortMenu').classList.toggle('open');
              }}

              document.addEventListener('click', () => {{
                document.getElementById('sortMenu').classList.remove('open');
              }});

              function setCategory(cat, btn) {{
                currentCat = cat;
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                filter();
              }}

              function setSort(mode, btn) {{
                currentSort = mode;
                document.querySelectorAll('.sort-item').forEach(i => i.classList.remove('active'));
                btn.classList.add('active');

                const list = document.getElementById('list');
                const cards = Array.from(list.querySelectorAll('.card'));

                cards.sort((a, b) => {{
                  if (mode === 'az') return a.dataset.name.localeCompare(b.dataset.name);
                  if (mode === 'za') return b.dataset.name.localeCompare(a.dataset.name);
                  const catRank = c => c.dataset.category === 'official' ? 0 : 1;
                  return catRank(a) - catRank(b) || a.dataset.name.localeCompare(b.dataset.name);
                }});

                cards.forEach(c => list.appendChild(c));
                filter();
              }}

              function filter() {{
                const q = document.getElementById('q').value.toLowerCase().trim();
                let visibleCount = 0;

                document.querySelectorAll('.card').forEach(c => {{
                  const matchText = c.dataset.search.includes(q);
                  const matchCat = (currentCat === 'all') || (c.dataset.category === currentCat);
                  if (matchText && matchCat) {{
                    c.style.display = 'block';
                    visibleCount++;
                  }} else {{
                    c.style.display = 'none';
                  }}
                }});

                document.getElementById('empty').style.display = visibleCount === 0 ? 'block' : 'none';
              }}

              function copyCmd(btn, text) {{
                navigator.clipboard.writeText(text).then(() => {{
                  const orig = btn.textContent;
                  btn.textContent = 'Copied!';
                  btn.classList.add('copied');
                  setTimeout(() => {{
                    btn.textContent = orig;
                    btn.classList.remove('copied');
                  }}, 1200);
                }});
              }}
            </script>
          </body>
          </html>'''

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(html_page)
          EOF

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add README.md index.html
          if ! git diff --cached --quiet; then
            git commit -m "docs: update package catalog and web index"
            git push
          fi
