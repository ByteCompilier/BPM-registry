name: Update Package Catalog

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_TOKEN }}

      - name: Generate README and Web Portal
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os, html, datetime, json, urllib.request

          NL, LT, GT = chr(10), chr(60), chr(62)
          GH_BASE = "https://github.com"
          GH_API = "https://github.com"

          def tag(n, a="", b=""):
              s = f" {a}" if a else ""
              return f"{LT}{n}{s}{GT}{b}{LT}/{n}{GT}"

          def otag(n, a=""):
              s = f" {a}" if a else ""
              return f"{LT}{n}{s}{GT}"

          def get_repo_files(slug):
              if not slug:
                  return []
              req = urllib.request.Request(GH_API + slug + "/contents", headers={"User-Agent": "BPM-Catalog-Bot"})
              tok = os.environ.get("GH_TOKEN", "")
              if tok:
                  req.add_header("Authorization", "Bearer " + tok)
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      items = json.loads(resp.read().decode("utf-8"))
                      return [[it.get("type", "file"), it.get("name", ""), it.get("html_url", "")] for it in items if isinstance(it, dict)]
              except Exception:
                  return []

          ignore = {'README.md', 'LICENSE', '.gitignore', 'index.html'}
          official = {'bytecompilier', 'gufau9089-tech'}
          off_rows, com_rows, off_cards, com_cards = [], [], [], []

          for name in sorted(os.listdir('.')):
              if name.startswith('.') or name in ignore or not os.path.isfile(name):
                  continue
              data = {}
              with open(name, 'r', encoding='utf-8', errors='ignore') as f:
                  for line in f:
                      if '=' in line:
                          k, v = line.strip().split('=', 1)
                          data[k.strip()] = v.strip()

              if 'version' in data and 'author' in data:
                  ver, author = data.get('version', '-'), data.get('author', '-')
                  desc, url = data.get('description', ''), data.get('url', '')
                  is_off = author.lower() in official
                  r_url = url.partition('/archive/')[0] if '/archive/' in url else (url.partition('/releases/')[0] if '/releases/' in url else url)
                  slug = r_url.replace(GH_BASE, '').strip('/') if r_url.startswith(GH_BASE) else ''
                  src = tag("a", f'class="src-link" href="{html.escape(r_url)}" target="_blank"', "Source ↗") if r_url.startswith('https://') else ""

                  if is_off:
                      off_rows.append(f"| `{name}` | `{ver}` | 🛡️ Official | {desc.replace('|', '\\|')} |")
                      badge, cat = tag("span", 'class="badge official"', "Official"), 'official'
                  else:
                      com_rows.append(f"| `{name}` | `{ver}` | [@{author}]({GH_BASE}{author}) | {desc.replace('|', '\\|')} |")
                      badge, cat = tag("span", 'class="badge"', f"@{html.escape(author)}"), 'community'

                  f_json = html.escape(json.dumps(get_repo_files(slug)))
                  args = f"'{html.escape(name)}','{html.escape(ver)}','{html.escape(author)}','{html.escape(desc)}',{f_json}"
                  hl = tag("h3", "", f'{html.escape(name)} {tag("span", "class=ver", "v" + html.escape(ver))}')
                  hr = tag("div", 'class="meta-right"', f'{tag("button", f"class=details-btn onclick=\"openDet({args})\"", "Details")} {src} {badge}')
                  cb = tag("div", 'class="cmd-box"', tag("code", "", f"bpm install {html.escape(name)}") + tag("button", f"class=copy-btn onclick=\"cp(this,'bpm install {html.escape(name)}')\"", "Copy"))
                  card = tag("div", f'class="card" data-name="{html.escape(name.lower())}" data-cat="{cat}" data-s="{html.escape((name+ver+author+desc).lower())}"', tag("div", 'class="card-head"', hl + hr) + tag("p", "", html.escape(desc) or "No description.") + cb)
                  (off_cards if is_off else com_cards).append(card)
          cards = off_cards + com_cards
          upd = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          def mk_tbl(r, emp):
              return emp if not r else NL.join(["| Package | Version | Author | Description |", "| :--- | :--- | :--- | :--- |"] + r)

          with open('README.md', 'r', encoding='utf-8') as f:
              rm = f.read()

          for st, en, tb in [(f"{LT}!-- OFFICIAL_START --{GT}", f"{LT}!-- OFFICIAL_END --{GT}", mk_tbl(off_rows, "_No official packages._")), (f"{LT}!-- COMMUNITY_START --{GT}", f"{LT}!-- COMMUNITY_END --{GT}", mk_tbl(com_rows, "_No community packages yet._"))]:
              if st in rm and en in rm:
                rm = rm.split(st)[0] + st + NL + tb + NL + en + rm.split(en)[1]
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(rm)

          css = """body{font-family:system-ui,sans-serif;background:#0d1117;color:#c9d1d9;max-width:840px;margin:36px auto;padding:0 20px}.top-bar,.status-bar,.toolbar,.card-head,.cmd-box,.modal-head,.file-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{color:#58a6ff;margin:0}.sub,p,.ver{color:#8b949e;font-size:14px}.nav-btn,.tab,.gear-btn,.copy-btn,.details-btn{background:#161b22;border:1px solid #30363d;color:#c9d1d9;padding:7px 14px;border-radius:8px;text-decoration:none;font-size:13px;cursor:pointer}.nav-btn.primary{background:#238636;border-color:#2ea043;color:#fff}.status-bar{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px 14px;margin:16px 0;font-size:13px}.status-online{color:#3fb950;font-weight:600}input,textarea{width:100%;padding:11px;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#fff;box-sizing:border-box;margin-bottom:14px}.tab.active{background:#1f6feb33;border-color:#58a6ff;color:#58a6ff}.sort-wrap{position:relative}.sort-menu{display:none;position:absolute;right:0;top:40px;background:#161b22;border:1px solid #30363d;border-radius:8px;min-width:170px;z-index:10}.sort-menu.open{display:block}.sort-item{display:block;width:100%;text-align:left;background:none;border:none;color:#c9d1d9;padding:9px 12px;cursor:pointer}.sort-item:hover{background:#21262d}.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;margin-bottom:14px}h3{margin:0;color:#f0f6fc}.meta-right,.tabs,.top-actions{display:flex;gap:8px;align-items:center}.src-link{color:#58a6ff;text-decoration:none;font-size:13px}.badge{font-size:12px;padding:3px 8px;border-radius:12px;background:#21262d}.badge.official{background:#1f6feb33;color:#58a6ff}.cmd-box{background:#0d1117;padding:6px 10px;border-radius:6px;border:1px solid #21262d}code{color:#7ee787}.copy-btn.copied{border-color:#2ea043;color:#7ee787}.empty{text-align:center;padding:30px;border:1px dashed #30363d;border-radius:8px;display:none}.modal-bg{display:none;position:fixed;inset:0;background:rgba(1,4,9,.75);z-index:50;align-items:center;justify-content:center;padding:16px}.modal-bg.open{display:flex}.modal{background:#161b22;border:1px solid #30363d;border-radius:10px;max-width:540px;width:100%;padding:20px;max-height:85vh;overflow-y:auto}.file-list{list-style:none;padding:0}.file-list li{padding:6px 10px;background:#0d1117;border-radius:6px;margin-top:6px;font-family:monospace;font-size:13px}.err{color:#f85149;font-size:13px;margin-bottom:8px}"""
          js_lines = [
              "let cat = 'all';",
              "function tSort(e) { e.stopPropagation(); document.getElementById('sm').classList.toggle('open'); }",
              "document.addEventListener('click', function() { document.getElementById('sm').classList.remove('open'); });",
              "function cMod() { document.querySelectorAll('.modal-bg').forEach(function(m) { m.classList.remove('open'); }); }",
              "function sCat(c, b) { cat = c; document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); }); b.classList.add('active'); flt(); }",
              "function sSort(m) { const l = document.getElementById('list'); const cs = Array.from(l.querySelectorAll('.card')); cs.sort(function(a, b) { if (m === 'az') return a.dataset.name.localeCompare(b.dataset.name); if (m === 'za') return b.dataset.name.localeCompare(a.dataset.name); const r = function(x) { return x.dataset.cat === 'official' ? 0 : 1; }; return r(a) - r(b) || a.dataset.name.localeCompare(b.dataset.name); }); cs.forEach(function(c) { l.appendChild(c); }); flt(); }",
              "function flt() { const q = document.getElementById('q').value.toLowerCase().trim(); let v = 0; document.querySelectorAll('.card').forEach(function(c) { const ok = c.dataset.s.includes(q) && (cat === 'all' || c.dataset.cat === cat); c.style.display = ok ? 'block' : 'none'; if (ok) v++; }); document.getElementById('emp').style.display = v ? 'none' : 'block'; }",
              "function cp(b, t) { navigator.clipboard.writeText(t).then(function() { const o = b.textContent; b.textContent = 'Copied!'; b.classList.add('copied'); setTimeout(function() { b.textContent = o; b.classList.remove('copied'); }, 1200); }); }",
              "function openDet(n, v, a, d, files) { document.getElementById('dT').textContent = n + ' v' + v; document.getElementById('dD').textContent = (d || 'No description.') + ' (by ' + a + ')'; document.getElementById('dC').textContent = 'bpm install ' + n; const ul = document.getElementById('dF'); ul.innerHTML = ''; if (!files || !files.length) { const li = document.createElement('li'); li.textContent = 'No files found.'; ul.appendChild(li); } else { files.forEach(function(f) { const x = document.createElement('li'); const sp = document.createElement('span'); const lk = document.createElement('a'); sp.textContent = (f === 'dir' ? '[DIR] ' : '[FILE] ') + f; lk.className = 'src-link'; lk.href = f; lk.target = '_blank'; lk.textContent = 'Open'; x.append(sp, lk); ul.appendChild(x); }); } document.getElementById('dMod').classList.add('open'); }",
              "function openPub() { bld(); document.getElementById('pMod').classList.add('open'); }",
              "function bld() { const n = document.getElementById('pN').value.trim(); const a = document.getElementById('pA').value.trim(); const v = document.getElementById('pV').value.trim(); const u = document.getElementById('pU').value.trim(); const d = document.getElementById('pD').value.trim(); const e = document.getElementById('pE'); e.textContent = (u && (u.includes('/refs/heads/') || (!u.includes('/refs/tags/') && !u.includes('/releases/download/')))) ? 'Use /refs/tags/... or /releases/download/...' : ''; const m = 'url=' + u + String.fromCharCode(10) + 'version=' + v + String.fromCharCode(10) + 'author=' + a + String.fromCharCode(10) + 'description=' + d; document.getElementById('pO').value = m; document.getElementById('pL').href = '" + GH_BASE + "/ByteCompilier/BPM-registry/new/main?filename=' + encodeURIComponent(n || 'pkg') + '&value=' + encodeURIComponent(m); }"
          ]
          js = NL.join(js_lines)

          compiler_url = GH_BASE + "/ByteCompilier/ByteC"
          top = tag("div", 'class="top-bar"', tag("div", "", tag("h1", "", "BPM Registry") + tag("div", 'class="sub"', "Official Package Registry for ByteC")) + tag("div", 'class="top-actions"', tag("a", f'class="nav-btn" href="{compiler_url}" target="_blank"', "ByteC ↗") + tag("button", 'class="nav-btn primary" onclick="openPub()"', "+ Publish Package")))
          st = tag("div", 'class="status-bar"', tag("div", "", tag("span", 'class="status-online"', "● Registry Online & Verified") + " · Patrol Active") + tag("div", "", f"Packages: {len(cards)} · Updated: {upd}"))
          tb = tag("div", 'class="toolbar"', tag("div", 'class="tabs"', tag("button", 'class="tab active" onclick="sCat(\'all\',this)"', f"All ({len(cards)})") + tag("button", 'class="tab" onclick="sCat(\'official\',this)"', f"🛡️ Official ({len(off_cards)})") + tag("button", 'class="tab" onclick="sCat(\'community\',this)"', f"🌍 Community ({len(com_cards)})")) + tag("div", 'class="sort-wrap"', tag("button", 'class="gear-btn" onclick="tSort(event)"', "⚙️") + tag("div", 'class="sort-menu" id="sm"', tag("button", 'class="sort-item" onclick="sSort(\'def\')"', "Default") + tag("button", 'class="sort-item" onclick="sSort(\'az\')"', "Name: A → Z") + tag("button", 'class="sort-item" onclick="sSort(\'za\')"', "Name: Z → A"))))
          dmod = tag("div", 'class="modal-bg" id="dMod" onclick="if(event.target===this)cMod()"', tag("div", 'class="modal"', tag("div", 'class="modal-head"', tag("h3", 'id="dT"', "") + tag("button", 'class="nav-btn" onclick="cMod()"', "✕")) + tag("p", 'id="dD"', "") + tag("div", 'class="cmd-box"', tag("code", 'id="dC"', "") + tag("button", 'class="copy-btn" onclick="cp(this,document.getElementById(\'dC\').textContent)"', "Copy")) + tag("ul", 'class="file-list" id="dF"', "")))
          pmod = tag("div", 'class="modal-bg" id="pMod" onclick="if(event.target===this)cMod()"', tag("div", 'class="modal"', tag("div", 'class="modal-head"', tag("h3", "", "Publish Package") + tag("button", 'class="nav-btn" onclick="cMod()"', "✕")) + otag("input", 'id="pN" placeholder="Package name" oninput="bld()"') + otag("input", 'id="pA" placeholder="GitHub username" oninput="bld()"') + otag("input", 'id="pV" value="1.0.0" oninput="bld()"') + otag("input", 'id="pU" placeholder="Tag ZIP URL (/refs/tags/v1.0.0.zip)" oninput="bld()"') + otag("input", 'id="pD" placeholder="Description" oninput="bld()"') + tag("div", 'id="pE" class="err"', "") + tag("textarea", 'id="pO" rows="4" readonly', "") + tag("div", 'class="top-actions"', tag("button", 'class="copy-btn" onclick="cp(this,document.getElementById(\'pO\').value)"', "Copy") + tag("a", 'id="pL" class="nav-btn primary" href="#" target="_blank"', "Create on GitHub ↗"))))

          page = f"{LT}!DOCTYPE html{GT}" + tag("html", 'lang="en"', tag("head", "", otag("meta", 'charset="UTF-8"') + otag("meta", 'name="viewport" content="width=device-width,initial-scale=1"') + tag("title", "", "BPM Registry") + tag("style", "", css)) + tag("body", "", top + st + otag("input", 'id="q" placeholder="Search name, version, author, description..." oninput="flt()"') + tb + tag("div", 'id="list"', "".join(cards)) + tag("div", 'id="emp" class="empty"', "No packages found.") + dmod + pmod + tag("script", "", js)))

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(page)
          EOF

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add README.md index.html
          if ! git diff --cached --quiet; then
            git commit -m "docs: update package catalog and web portal"
            git push
          fi

