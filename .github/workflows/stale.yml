name: Close Inactive Issues

on:
  schedule:
    - cron: '0 0 * * *' # Проверка раз в сутки в полночь

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 7
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-issue-message: 'This issue has been automatically marked as stale because it has not had recent activity. It will be closed in 7 days if no further activity occurs.'
          stale-pr-message: 'This Pull Request has been inactive for 14 days and will be closed in 7 days if not updated.'
          exempt-issue-labels: 'security,pinned'
