name: Website Status Check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check website status
        run: |
          URL="https://bytecompilier.github.io/BPM-registry"
          HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" --max-time 10 "$URL" || echo "000")
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            CONTENT='{"schemaVersion": 1, "label": "Web Portal", "message": "online", "color": "brightgreen"}'
          else
            CONTENT='{"schemaVersion": 1, "label": "Web Portal", "message": "offline", "color": "red"}'
          }

          # Записываем статус в Gist
          # Замените GIST_ID на ID вашего гиста
          GIST_ID="ваш_gist_id"
          TOKEN="${{ secrets.ADMIN_TOKEN }}" # или можете вставить сам токен, но лучше через Secrets
          
          payload=$(jq -n --arg content "$CONTENT" '{files: {"status.json": {content: $content}}}')
          
          curl -X PATCH \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/gists/$GIST_ID \
            -d "$payload"
